# Gerado por scripts/semgrep.js a partir de src/rules.js. Não edite à mão.
# Onde a CLI procura "cnpj" nas linhas vizinhas (CA001, CA007, CA008), aqui ele precisa
# estar na mesma linha: campos de formulário quebrados em várias linhas podem escapar.
rules:
  - id: cnpj-alfa-ca001
    message: 'Regex aceita só dígitos no CNPJ. O padrão exige 12 ou 14 dígitos. O CNPJ alfanumérico tem letras nas 12 primeiras posições. Correção: Use /^[A-Z0-9]{12}\d{2}$/ (sem máscara) ou /^[A-Z0-9]{2}\.?[A-Z0-9]{3}\.?[A-Z0-9]{3}\/?[A-Z0-9]{4}-?\d{2}$/i.'
    severity: ERROR
    languages: [generic]
    metadata:
      source: 'https://github.com/AstralunaProject/cnpj-alfa-scan#ca001'
    patterns:
      - pattern-either:
          - pattern-regex: '^(?=.*(?i:cnpj)).*?(?:\\d|\[0-9\]|\[\\d\])\{1[24]\}'
  - id: cnpj-alfa-ca002
    message: 'Regex de CNPJ formatado aceita só dígitos. O padrão reconhece o formato 00.000.000/0000-00 apenas com dígitos. Correção: Troque \d por [A-Z0-9] nos 4 primeiros grupos; só os 2 dígitos verificadores continuam numéricos.'
    severity: ERROR
    languages: [generic]
    metadata:
      source: 'https://github.com/AstralunaProject/cnpj-alfa-scan#ca002'
    patterns:
      - pattern-either:
          - pattern-regex: '(?:\\d|\[0-9\])\{2\}.{0,12}?(?:\\d|\[0-9\])\{3\}.{0,12}?(?:\\d|\[0-9\])\{3\}.{0,12}?(?:\\d|\[0-9\])\{4\}'
  - id: cnpj-alfa-ca003
    message: 'CNPJ convertido para número. Converter o CNPJ para inteiro falha (NaN, exceção) ou corrompe o valor quando há letras. Correção: Mantenha o CNPJ como texto do começo ao fim. Para o dígito verificador, use o valor ASCII − 48 de cada caractere.'
    severity: ERROR
    languages: [generic]
    metadata:
      source: 'https://github.com/AstralunaProject/cnpj-alfa-scan#ca003'
    patterns:
      - pattern-either:
          - pattern-regex: '(?i)^(?=.*(?i:cnpj)).*?\b(?:parseInt|parseFloat|Number|BigInt|int|long|float|intval|floatval|Integer\.parseInt|Integer\.valueOf|Long\.parseLong|Long\.valueOf|BigInteger|BigDecimal|Convert\.ToInt(?:32|64)|Convert\.ToDecimal|(?:int|long|Int32|Int64|decimal)\.(?:Try)?Parse|strconv\.(?:Atoi|ParseInt|ParseUint)|to_number)\s*\(\s*[^()]*cnpj'
          - pattern-regex: '(?i)^(?=.*(?i:cnpj)).*?\bCAST\s*\(\s*\w*cnpj\w*\s+AS\s+(?:bigint|big_?integer|int|int2|int4|int8|int32|int64|uint32|uint64|integer|smallint|mediumint|tinyint|numeric|decimal|number|long|double|float)\b'
          - pattern-regex: '(?i)^(?=.*(?i:cnpj)).*?\(\s*(?:int|long|float|double)\s*\)\s*\$?\w*cnpj'
          - pattern-regex: '(?i)^(?=.*(?i:cnpj)).*?\bcnpj\w*(?:\[[^\]]*\])?(?:\(\))?\.(?:to_i|toInt|toLong|toBigInteger|toDouble|intValue|longValue)\b'
          - pattern-regex: '(?i)^(?=.*(?i:cnpj)).*?\bint\(\s*(\w+)\s*\)\s+for\s+\1\s+in\s+[\w.]*cnpj'
          - pattern-regex: '(?i)^(?=.*(?i:cnpj)).*?cnpj\w*\.split\([^)]*\)\.map\(\s*(?:Number|parseInt|parseFloat)\b'
          - pattern-regex: '^(?=.*(?i:cnpj)).*?\bCharacter\.getNumericValue\b'
  - id: cnpj-alfa-ca004
    message: 'Remoção de tudo que não é dígito. Limpar o CNPJ removendo não-dígitos apaga as letras do CNPJ alfanumérico. Correção: Remova só a pontuação: valor.replace(/[.\/-]/g, "").toUpperCase().'
    severity: ERROR
    languages: [generic]
    metadata:
      source: 'https://github.com/AstralunaProject/cnpj-alfa-scan#ca004'
    patterns:
      - pattern-either:
          - pattern-regex: '^(?=.*(?i:cnpj)).*?(?:\\D|\[\^0-9\]|\[\^\\d\])'
          - pattern-regex: '(?i)^(?=.*(?i:cnpj)).*?\b(?:only_?digits|digits_?only|only_?numbers|somente_?numeros|apenas_?numeros|so_?numeros|somente_?digitos|apenas_?digitos|extrair_?numeros|remover_?nao_?numericos)\s*\('
  - id: cnpj-alfa-ca005
    message: 'Verificação de que o CNPJ é numérico. Checagens como isdigit, is_numeric ou ^\d+$ rejeitam o CNPJ alfanumérico. Correção: Valide o formato com /^[A-Z0-9]{12}\d{2}$/ e o dígito verificador.'
    severity: ERROR
    languages: [generic]
    metadata:
      source: 'https://github.com/AstralunaProject/cnpj-alfa-scan#ca005'
    patterns:
      - pattern-either:
          - pattern-regex: '^(?=.*(?i:cnpj)).*?\b(?:isdigit|isnumeric|isdecimal|ctype_digit|is_numeric|isNaN|IsDigit|IsNumber|isNumeric|isInteger|isSafeInteger|isdigit)\b'
          - pattern-regex: '^(?=.*(?i:cnpj)).*?\^(?:\\d|\[0-9\])[+*]\$'
          - pattern-regex: '^(?=.*(?i:cnpj)).*?\[\[:digit:\]\]'
  - id: cnpj-alfa-ca006
    message: 'CNPJ declarado com tipo numérico. Coluna, campo ou propriedade numérica não comporta letras. É o ponto que mais quebra em produção. Correção: Use texto: CHAR(14)/VARCHAR(14) no banco, string no código.'
    severity: ERROR
    languages: [generic]
    metadata:
      source: 'https://github.com/AstralunaProject/cnpj-alfa-scan#ca006'
    patterns:
      - pattern-either:
          - pattern-regex: '(?i)\b\w*cnpj(?!\w*(?:len|length|size|count|idx|index|pos|tamanho|qtd))\w*["''`\]]?\s+(?:set\s+data\s+)?(?:type\s+)?(?:unsigned\s+)?(?:bigint|big_?integer|int|int2|int4|int8|int32|int64|uint32|uint64|integer|smallint|mediumint|tinyint|numeric|decimal|number|long|double|float)\b'
          - pattern-regex: '(?i)\bcnpj(?!\w*(?:len|length|size|count|idx|index|pos|tamanho|qtd))\w*\??\s*:\s*(?:number|bigint|int|long|u?int(?:32|64)|BigInteger|BigDecimal|Double|Decimal|float)\b'
          - pattern-regex: '(?i)\b(?:long|int|integer|biginteger|bigdecimal|int64|uint64|ulong|double|decimal)\??\s+_?cnpj(?!\w*(?:len|length|size|count|idx|index|pos|tamanho|qtd))\w*\b'
          - pattern-regex: '(?i)\bcnpj\w*\s*=\s*(?:[\w.]+\.)?(?:Column\(\s*(?:[\w.]+\.)?)?(?:BigInteger|Integer|BigIntegerField|IntegerField|PositiveBigIntegerField|PositiveIntegerField|DecimalField|FloatField|Numeric|Float|IntField|BigIntField|LongField)\b'
          - pattern-regex: '(?i)\bcnpj\w*\s*:\s*\{?\s*type\s*:\s*(?:Number|(?:DataTypes|Sequelize)\.(?:BIGINT|INTEGER|DECIMAL|FLOAT|DOUBLE))\b'
          - pattern-regex: '(?i)->(?:unsigned)?(?:big|tiny|small|medium)?[iI]nteger\(\s*[''"]\w*cnpj|->(?:decimal|double|float)\(\s*[''"]\w*cnpj'
          - pattern-regex: '(?i)\bt\.(?:bigint|integer|decimal|float)\s+:\w*cnpj|:\w*cnpj\w*,\s*:(?:bigint|integer|decimal|float)\b'
          - pattern-regex: '(?i)"\w*cnpj\w*"\s*:\s*\{\s*"type"\s*:\s*"(?:integer|number)"'
          - pattern-regex: '(?i)\bcnpj\w*\s*:\s*z\.(?:number|bigint)\('
  - id: cnpj-alfa-ca007
    message: 'Campo de CNPJ com input numérico. type="number" não aceita letras; o usuário não consegue digitar o CNPJ alfanumérico. Correção: Use type="text" com autocapitalize="characters" e maxlength="18".'
    severity: ERROR
    languages: [generic]
    metadata:
      source: 'https://github.com/AstralunaProject/cnpj-alfa-scan#ca007'
    patterns:
      - pattern-either:
          - pattern-regex: '(?i)^(?=.*(?i:cnpj)).*?\btype\s*=\s*\{?\s*["''`]number["''`]'
  - id: cnpj-alfa-ca008
    message: 'Teclado ou máscara numérica no campo de CNPJ. inputmode numérico, type="tel" ou teclado numérico no app escondem as letras do teclado. Correção: Use inputmode="text" (ou omita) e autocapitalize="characters".'
    severity: WARNING
    languages: [generic]
    metadata:
      source: 'https://github.com/AstralunaProject/cnpj-alfa-scan#ca008'
    patterns:
      - pattern-either:
          - pattern-regex: '(?i)^(?=.*(?i:cnpj)).*?\binputmode\s*=\s*\{?\s*["''`](?:numeric|decimal|tel)["''`]'
          - pattern-regex: '(?i)^(?=.*(?i:cnpj)).*?\btype\s*=\s*\{?\s*["''`]tel["''`]'
          - pattern-regex: '(?i)^(?=.*(?i:cnpj)).*?\bkeyboardType\s*[=:]\s*\{?\s*["''`]?(?:numeric|number-pad|phone-pad|decimal-pad)'
          - pattern-regex: '^(?=.*(?i:cnpj)).*?\bKeyboardType\.(?:Number|Phone|NumberPassword|Decimal)\b|\bTextInputType\.(?:number|phone)\b|\bInputType\.TYPE_CLASS_(?:NUMBER|PHONE)\b'
          - pattern-regex: '(?i)^(?=.*(?i:cnpj)).*?\bpattern\s*=\s*\{?\s*["''`]\^?(?:\\d|\[0-9\])'
  - id: cnpj-alfa-ca009
    message: 'Máscara de CNPJ só com dígitos. Máscaras como 99.999.999/9999-99 ou 00.000.000/0000-00 bloqueiam letras na digitação. Correção: Use uma máscara alfanumérica nos 12 primeiros caracteres, ex.: "AA.AAA.AAA/AAAA-00" (ngx-mask) ou equivalente.'
    severity: ERROR
    languages: [generic]
    metadata:
      source: 'https://github.com/AstralunaProject/cnpj-alfa-scan#ca009'
    patterns:
      - pattern-either:
          - pattern-regex: '["''`](?:99\.999\.999\/9999-99|00\.000\.000\/0000-00|##\.###\.###\/####-##|99999999999999|00000000000000)["''`]'
  - id: cnpj-alfa-ca010
    message: 'CNPJ formatado como número com zeros à esquerda. zfill/padStart/%014d indicam que o CNPJ circula como número e é reconvertido em texto. Correção: Armazene e trafegue o CNPJ como texto de 14 caracteres; não reconstrua a partir de um número.'
    severity: WARNING
    languages: [generic]
    metadata:
      source: 'https://github.com/AstralunaProject/cnpj-alfa-scan#ca010'
    patterns:
      - pattern-either:
          - pattern-regex: '(?i)^(?=.*(?i:cnpj)).*?zfill\(\s*14\s*\)|padStart\(\s*14\s*,|%014d|:014d|PadLeft\(\s*14\s*,|lpad\([^)]*,\s*14\b|rjust\(\s*14\s*,\s*["'']0'
