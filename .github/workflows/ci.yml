name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exemplos legados devem falhar
        id: legado
        uses: ./
        continue-on-error: true
        with:
          path: examples/legado
          sarif: legado.sarif
      - name: Conferir resultado da Action
        env:
          OUTCOME: ${{ steps.legado.outcome }}
          ERRORS: ${{ steps.legado.outputs.errors }}
          SARIF: ${{ steps.legado.outputs.sarif-file }}
        run: |
          test "$OUTCOME" = failure
          test "$ERRORS" -gt 0
          test -s "$SARIF"
      - name: Código do projeto deve passar
        uses: ./
        with:
          ignore: |
            test/**
            examples/**
            rules/**
            site/**
            src/rules.js
